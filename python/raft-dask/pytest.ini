[pytest]
filterwarnings =
    error
    # NVML CPU affinity queries are not supported on WSL; dask-cuda falls back to all CPUs.
    ignore:Cannot get CPU affinity for device:UserWarning
markers =
  unit: marks unit tests
  quality: marks quality tests
  stress: marks stress tests
  mg: marks a test as multi-GPU
  memleak: marks a test as a memory leak test
  nccl: marks a test as using NCCL
  ucx: marks a test as using UCXX
addopts = --tb=native
